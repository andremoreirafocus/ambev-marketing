<title id="title">Cervejas com álcool: comparação de calorias por 100 ml</title>
<desc id="desc">Michelob Ultra: 25,8; Amstel Ultra: 26,2; Heineken Ultimate: 29,4; Stella Pure Gold: 33,9 quilocalorias por 100 ml. Valores calculados pelas porções informadas nas fontes.</desc>
